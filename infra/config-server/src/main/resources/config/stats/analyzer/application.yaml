grpc:
  server:
    port: 0
  client:
    analyzer:
      address: 'discovery:///analyzer'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

analyzer:
  user-action-weight:
    view: 0.4
    register: 0.8
    like: 1.0
  kafka:
    action-consumer-props:
      bootstrap.servers: "localhost:9092"
      group.id: "analyzer-group"
      key.deserializer: "org.apache.kafka.common.serialization.LongDeserializer"
      value.deserializer: "ru.practicum.avro.UserActionDeserializer"
      enable.auto.commit: "false"
      auto.offset.reset: "earliest"
    similarity-consumer-props:
      bootstrap.servers: "localhost:9092"
      group.id: "analyzer-group"
      key.deserializer: "org.apache.kafka.common.serialization.LongDeserializer"
      value.deserializer: "ru.practicum.avro.EventSimilarityDeserializer"
      enable.auto.commit: "false"
      auto.offset.reset: "earliest"
    topics:
      USER_ACTIONS: "stats.user-actions.v1"
      EVENTS_SIMILARITY: "stats.events-similarity.v1"
    attempt-timeout: 500

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6543/ewm_stats_db
    username: stat_user
    password: stat_password